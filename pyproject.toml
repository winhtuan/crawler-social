[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlfb"
version = "0.1.0"
description = "Crawl public Facebook page posts"
requires-python = ">=3.10"
dependencies = [
  "playwright==1.49.1",
  "pydantic==2.10.4",
  "python-dotenv==1.0.1",
  "cloakbrowser==0.5.10",
  "psutil==7.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
